# ==============================================================================
# Synology Space Analyzer - Compose-Stack
#
# Start:   docker compose up -d
#
# Danach http://localhost:8080 aufrufen - beim ersten Mal legst du dort
# Benutzername und Passwort an. Eine .env brauchst du dafuer nicht.
# ==============================================================================

services:
  ssa:
    build: .
    image: ssa:latest
    container_name: ssa
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional: Login-Passwort aus der Umgebung. Gesetzt hat es Vorrang und
      # ueberspringt die Ersteinrichtung; leer (Default) heisst "im Browser
      # einrichten". Fuer Deployments, die Secrets ohnehin injizieren.
      SSA_ADMIN_PASSWORD: ${SSA_ADMIN_PASSWORD:-}
      # Optional:
      # SSA_ADMIN_USER: admin
      # SSA_SETUP_TOKEN: langes-zufaelliges-token   # schuetzt die Ersteinrichtung
      # SSA_SECRET_KEY: langer-zufaelliger-string   # sonst auto data/secret.key im Volume
      # SSA_TOKEN_TTL_HOURS: "168"
    volumes:
      # Persistente Daten: SQLite (Historie, Jobs, verschluesselte NAS-Creds,
      # Admin-Konto als Hash) und der auto-generierte secret.key
      - ssa-data:/app/data

    # --- Betrieb ---
    # Dieser Dienst laeuft als GENAU EIN Prozess und darf nicht repliziert
    # werden (kein "docker compose up --scale ssa=2", keine zusaetzlichen
    # uvicorn-Worker). Scheduler, Doppelstart-Schutz fuer Scans und das
    # Login-Rate-Limit liegen im Prozessspeicher; mehrere Prozesse wuerden
    # denselben Job mehrfach parallel gegen das NAS laufen lassen.
    # Der Prozess sichert das zusaetzlich ueber ein Lock im Datenvolume ab.

    # --- Haertung ---
    # Der Container laeuft als unprivilegierter Benutzer (UID 1000, siehe Dockerfile).
    #
    # BESTEHENDE INSTALLATION: Ein Datenvolume aus einer aelteren Version gehoert
    # noch root. Einmalig uebereignen, sonst startet der Container nicht:
    #   docker compose down
    #   docker run --rm -v ssa_ssa-data:/data alpine chown -R 1000:1000 /data
    #   docker compose up -d
    read_only: true          # Root-Dateisystem unveraenderlich
    tmpfs:
      - /tmp                 # einziger beschreibbarer Pfad ausser dem Datenvolume
    cap_drop:
      - ALL                  # die App braucht keine Linux-Capabilities
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

volumes:
  ssa-data:
