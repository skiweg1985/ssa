name: Release

# Baut das Frontend, schnürt Backend + gebautes Frontend zu einem
# lauffähigen Paket und hängt es als Download-Asset an ein GitHub Release.
# Wird ausgelöst, sobald ein Tag der Form v* gepusht wird (z.B. v1.2.0).

on:
  push:
    tags:
      - "v*"
  # Manueller Start zum Testen (erzeugt kein Release, nur die Artefakte).
  # Der Release-Notes-Kopf wird dabei erzeugt und in die Job-Zusammenfassung
  # geschrieben - so laesst er sich pruefen, ohne ein Release anzulegen.
  workflow_dispatch:
    inputs:
      notes_from:
        description: "Notes-Test: Start-Tag (leer = letzter Tag)"
        required: false
      notes_to:
        description: "Notes-Test: End-Ref (leer = HEAD)"
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Schreibrechte nur fuer diesen Job (Release + Assets anlegen)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # gh nutzt GITHUB_TOKEN, die Checkout-Credentials werden nicht gebraucht
          persist-credentials: false
          # Vollstaendige Historie inkl. Tags: der Release-Notes-Schritt braucht
          # den Vorgaenger-Tag und die Commits seitdem. Ein flacher Klon hat beides nicht.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # Muss zu ci.yml und dem Dockerfile passen (Vite 7 braucht >=20.19).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Paket schnüren
        id: package
        run: |
          # Version aus dem Tag (Fallback für workflow_dispatch)
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          STAGE="ssa-${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

          mkdir -p "dist-pkg/${STAGE}"

          # Backend + Laufzeit-Dateien
          cp -r app "dist-pkg/${STAGE}/"
          cp explore_syno_api.py requirements.txt "dist-pkg/${STAGE}/"
          cp .env.example "dist-pkg/${STAGE}/"
          cp README.md README_CLI.md README_SERVER.md "dist-pkg/${STAGE}/"
          cp install.sh service.sh uninstall.sh "dist-pkg/${STAGE}/"

          # Frisch gebautes Frontend (das Backend erwartet frontend/dist neben app/)
          mkdir -p "dist-pkg/${STAGE}/frontend"
          cp -r frontend/dist "dist-pkg/${STAGE}/frontend/dist"

          # __pycache__ nicht mitpacken
          find "dist-pkg/${STAGE}" -type d -name __pycache__ -prune -exec rm -rf {} +

          cd dist-pkg
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          zip -rq "${STAGE}.zip" "${STAGE}"
          ls -la

      - name: Artefakte hochladen (immer, auch bei workflow_dispatch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ steps.package.outputs.stage }}
          path: |
            dist-pkg/${{ steps.package.outputs.stage }}.tar.gz
            dist-pkg/${{ steps.package.outputs.stage }}.zip

      # Der redaktionelle Kopf der Release-Notes: was sich fuer Betreiber aendert,
      # was bricht, was beim Upgrade zu tun ist. Die vollstaendige PR-Liste kommt
      # im naechsten Schritt von GitHub selbst.
      #
      # Schlaegt der Schritt fehl (Secret fehlt, Modell antwortet nicht), laeuft das
      # Release trotzdem durch - dann eben nur mit der generierten Liste.
      # Laeuft auch beim manuellen Start - sonst waere das naechste echte Release
      # der erste Test, und das ist der falsche Moment, um Fehler zu finden.
      - name: Release-Notes-Kopf erzeugen
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FROM="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")"
            TO="${GITHUB_REF_NAME}"
          else
            FROM="${{ inputs.notes_from }}"
            TO="${{ inputs.notes_to }}"
            [ -n "$FROM" ] || FROM="$(git describe --tags --abbrev=0)"
            [ -n "$TO" ] || TO="HEAD"
          fi

          echo "Bereich: ${FROM}..${TO}"
          python3 scripts/release_notes.py "${FROM}" "${TO}" > release-notes-head.md

          # In die Job-Zusammenfassung, damit der Text ohne Release lesbar ist.
          {
            echo "## Release-Notes-Kopf (\`${FROM}..${TO}\`)"
            echo
            cat release-notes-head.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: GitHub Release erstellen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.package.outputs.version }}"

          # Erzeugter Kopf (falls vorhanden) ...
          if [ -s release-notes-head.md ]; then
            cat release-notes-head.md > notes.md
            printf '\n\n' >> notes.md
          else
            echo "::warning::Kein Release-Notes-Kopf erzeugt - Release enthaelt nur die PR-Liste."
            : > notes.md
          fi

          # ... darunter die vollstaendige PR-Liste, wie sie --generate-notes liefert.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${VERSION}" --jq .body >> notes.md

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file notes.md \
            "dist-pkg/ssa-${VERSION}.tar.gz" \
            "dist-pkg/ssa-${VERSION}.zip"
