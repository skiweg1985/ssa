name: CI

# Verifiziert bei jedem Pull Request (und Push auf main), dass Backend-Tests
# durchlaufen und das Frontend baubar ist. Reines Sicherheitsnetz – erstellt
# keine Artefakte (das übernimmt release.yml bei Tags).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t ssa:ci .

      - name: Container starten
        run: |
          docker run -d --name ssa-ci \
            -e SSA_ADMIN_PASSWORD=ci-test-passwort \
            -p 8080:8080 \
            ssa:ci

      - name: Smoke-Test (Health + Login + Auth-Durchsetzung)
        run: |
          # Auf /health warten (max. 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Health OK nach ${i} Versuchen"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::/health nicht erreichbar"
              exit 1
            fi
            sleep 2
          done

          # Ohne Token muss /api/scans 401 liefern
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/scans)
          [ "$STATUS" = "401" ] || { echo "::error::Erwartet 401 ohne Token, bekam $STATUS"; exit 1; }

          # Login muss ein Token liefern
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-test-passwort"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          [ -n "$TOKEN" ] || { echo "::error::Login lieferte kein Token"; exit 1; }

          # Mit Token muss /api/scans 200 liefern (und das Frontend ausgeliefert werden)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/scans > /dev/null
          curl -sf http://localhost:8080/ | grep -qi '<div id="root">' \
            || { echo "::error::Frontend index.html wird nicht ausgeliefert"; exit 1; }
          echo "Smoke-Test bestanden"

      - name: Container-Logs (bei Fehler)
        if: failure()
        run: docker logs ssa-ci || true

      - name: Aufraeumen
        if: always()
        run: docker rm -f ssa-ci || true
