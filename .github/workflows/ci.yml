name: CI

# Verifiziert bei jedem Pull Request (und Push auf main), dass Backend-Tests
# durchlaufen und das Frontend baubar ist. Reines Sicherheitsnetz – erstellt
# keine Artefakte (das übernimmt release.yml bei Tags).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least Privilege: die CI liest nur den Code
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt zieht requirements.txt selbst mit rein
          pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # Vite 7 verlangt ^20.19.0 || >=22.12.0; Node 20 ist ausserdem
          # seit April 2026 aus dem Support.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Security-Audit (Produktionsabhaengigkeiten)
        working-directory: frontend
        # Nur Runtime-Deps sind hart: was im Browser landet, muss sauber sein.
        # Das Dev-/Build-Tooling ist derzeit ebenfalls ohne Befund; ob das
        # Gate dauerhaft auf einen vollen Audit gezogen werden kann, wird
        # separat entschieden.
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Image bauen
        run: docker build -t ssa:ci .

      - name: Container starten (mit denselben Haertungsflags wie docker-compose.yml)
        run: |
          docker run -d --name ssa-ci \
            -e SSA_ADMIN_PASSWORD=ci-test-passwort \
            -p 8080:8080 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            -v ssa-ci-data:/app/data \
            ssa:ci

      - name: Haertung verifizieren (non-root)
        run: |
          UID_IN_CONTAINER=$(docker exec ssa-ci id -u)
          [ "$UID_IN_CONTAINER" = "1000" ] || {
            echo "::error::Container laeuft als UID $UID_IN_CONTAINER statt 1000 (non-root)"
            exit 1
          }
          echo "Container laeuft als UID $UID_IN_CONTAINER (non-root)"

      - name: Kein Test-Werkzeug im Produktions-Image
        run: |
          # requirements.txt ist Runtime-only; pytest & Co. gehoeren in
          # requirements-dev.txt. Wenn sie hier importierbar sind, ist die
          # Trennung wieder kaputt.
          for MODULE in pytest pytest_mock httpx2; do
            if docker exec ssa-ci python -c "import ${MODULE}" 2>/dev/null; then
              echo "::error::${MODULE} ist im Produktions-Image installiert - Test-Deps gehoeren nach requirements-dev.txt"
              exit 1
            fi
          done
          echo "Image enthaelt kein Test-Werkzeug"

      - name: Smoke-Test (Health + Login + Auth-Durchsetzung)
        run: |
          # Auf /health warten (max. 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Health OK nach ${i} Versuchen"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::/health nicht erreichbar"
              exit 1
            fi
            sleep 2
          done

          # Ohne Token muss /api/scans 401 liefern
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/scans)
          [ "$STATUS" = "401" ] || { echo "::error::Erwartet 401 ohne Token, bekam $STATUS"; exit 1; }

          # Login muss ein Token liefern
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-test-passwort"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          [ -n "$TOKEN" ] || { echo "::error::Login lieferte kein Token"; exit 1; }

          # Mit Token muss /api/scans 200 liefern (und das Frontend ausgeliefert werden)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/scans > /dev/null
          curl -sf http://localhost:8080/ | grep -qi '<div id="root">' \
            || { echo "::error::Frontend index.html wird nicht ausgeliefert"; exit 1; }
          echo "Smoke-Test bestanden"

      - name: Ersteinrichtung (Container ohne jede Konfiguration)
        run: |
          # Der eigentliche Standardweg: "docker compose up -d" ohne .env.
          # Eigener Container, damit der Headless-Fall oben unberuehrt bleibt.
          docker run -d --name ssa-ci-setup \
            -p 8081:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            -v ssa-ci-setup-data:/app/data \
            ssa:ci

          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/health > /dev/null && break
            [ "$i" = "30" ] && { echo "::error::/health nicht erreichbar"; exit 1; }
            sleep 2
          done

          # Ohne Konto meldet der Status "Einrichtung offen" und der Login 503
          curl -sf http://localhost:8081/api/auth/setup-status | grep -q '"setup_required":true' \
            || { echo "::error::setup_required war nicht true"; exit 1; }
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"x"}')
          [ "$STATUS" = "503" ] || { echo "::error::Erwartet 503 vor der Einrichtung, bekam $STATUS"; exit 1; }

          # Einrichtung meldet direkt an
          TOKEN=$(curl -sf -X POST http://localhost:8081/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-test-passwort"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          [ -n "$TOKEN" ] || { echo "::error::Einrichtung lieferte kein Token"; exit 1; }
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8081/api/scans > /dev/null

          # Ein zweiter Versuch darf das Konto nicht uebernehmen
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"angreifer","password":"uebernahme1"}')
          [ "$STATUS" = "409" ] || { echo "::error::Zweite Einrichtung lieferte $STATUS statt 409"; exit 1; }

          # Neustart: das Konto liegt im Volume, nicht im Prozess
          docker restart ssa-ci-setup > /dev/null
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/health > /dev/null && break
            [ "$i" = "30" ] && { echo "::error::/health nach Neustart nicht erreichbar"; exit 1; }
            sleep 2
          done
          curl -sf -X POST http://localhost:8081/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-test-passwort"}' > /dev/null \
            || { echo "::error::Login nach Neustart fehlgeschlagen"; exit 1; }
          echo "Ersteinrichtung bestanden"

      - name: Container-Logs (bei Fehler)
        if: failure()
        run: |
          docker logs ssa-ci || true
          docker logs ssa-ci-setup || true

      - name: Aufraeumen
        if: always()
        run: |
          docker rm -f ssa-ci ssa-ci-setup || true
          docker volume rm ssa-ci-data ssa-ci-setup-data || true

  # Das Release baut das Image fuer amd64 UND arm64. Ein arm64-Problem (fehlendes
  # Wheel nach einem Dependency-Update, Paket ohne aarch64-Build) faellt dort
  # sonst erst auf, wenn es zu spaet ist: release.yml haengt per "needs" daran,
  # das Release entsteht dann komplett nicht.
  #
  # Eigener Job statt eines Schrittes im docker-Job: so laeuft er PARALLEL zum
  # Smoke-Test, die CI-Gesamtzeit steigt also nur um die Differenz, nicht um die
  # volle Build-Dauer.
  docker-arm64:
    name: Docker (arm64 baubar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: QEMU einrichten (arm64-Emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # "type=cacheonly": bauen, aber nichts exportieren. Uns interessiert nur,
      # DASS es durchlaeuft - das Image selbst testet der docker-Job oben (nativ
      # und damit deutlich schneller).
      #
      # Eigener Cache-Scope, sonst verdraengen sich CI und Release gegenseitig.
      - name: arm64-Build pruefen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64

  # Es gibt zwei Compose-Dateien: docker-compose.yml baut aus dem Quellcode,
  # docker-compose.ghcr.yml zieht das fertige Image. Die Haertung muss in beiden
  # identisch sein - sonst laeuft der Standardweg (Registry-Image) irgendwann
  # unbemerkt schwaecher abgesichert als der Entwickler-Weg.
  #
  # Zwei Dateien statt einer Override-Datei, weil "build: !reset null" Compose
  # >= 2.24 braucht und DSM 7.2 noch 2.20.x ausliefert.
  compose-drift:
    name: Compose (Haertung synchron)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Haertung beider Compose-Dateien vergleichen
        run: |
          # "compose config" normalisiert beide Dateien (Defaults aufgeloest,
          # Kurzschreibweisen expandiert) - ein reiner Textvergleich wuerde an
          # Formatierung scheitern. Der Vergleich prueft nebenbei, dass beide
          # Dateien ueberhaupt gueltig sind.
          extract() {
            docker compose -f "$1" config --format json \
              | jq -S '.services.ssa | {read_only, tmpfs, cap_drop, security_opt,
                                        pids_limit, ports, volumes, environment,
                                        restart, container_name}'
          }

          extract docker-compose.yml      > /tmp/compose-build.json
          extract docker-compose.ghcr.yml > /tmp/compose-ghcr.json

          if ! diff -u /tmp/compose-build.json /tmp/compose-ghcr.json; then
            echo "::error::docker-compose.yml und docker-compose.ghcr.yml sind auseinandergelaufen - Haertung/Betrieb muss in beiden identisch sein (siehe diff oben)"
            exit 1
          fi
          echo "Beide Compose-Dateien sind synchron"
