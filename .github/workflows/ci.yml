name: CI

# Verifiziert bei jedem Pull Request (und Push auf main), dass Backend-Tests
# durchlaufen und das Frontend baubar ist. Reines Sicherheitsnetz – erstellt
# keine Artefakte (das übernimmt release.yml bei Tags).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least Privilege: die CI liest nur den Code
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Security-Audit (Produktionsabhaengigkeiten)
        working-directory: frontend
        # Nur Runtime-Deps sind hart: was im Browser landet, muss sauber sein.
        # Dev-/Build-Tooling wird separat gepflegt (Vite-Major offen).
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Image bauen
        run: docker build -t ssa:ci .

      - name: Container starten (mit denselben Haertungsflags wie docker-compose.yml)
        run: |
          docker run -d --name ssa-ci \
            -e SSA_ADMIN_PASSWORD=ci-test-passwort \
            -p 8080:8080 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            -v ssa-ci-data:/app/data \
            ssa:ci

      - name: Haertung verifizieren (non-root)
        run: |
          UID_IN_CONTAINER=$(docker exec ssa-ci id -u)
          [ "$UID_IN_CONTAINER" = "1000" ] || {
            echo "::error::Container laeuft als UID $UID_IN_CONTAINER statt 1000 (non-root)"
            exit 1
          }
          echo "Container laeuft als UID $UID_IN_CONTAINER (non-root)"

      - name: Smoke-Test (Health + Login + Auth-Durchsetzung)
        run: |
          # Auf /health warten (max. 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Health OK nach ${i} Versuchen"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::/health nicht erreichbar"
              exit 1
            fi
            sleep 2
          done

          # Ohne Token muss /api/scans 401 liefern
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/scans)
          [ "$STATUS" = "401" ] || { echo "::error::Erwartet 401 ohne Token, bekam $STATUS"; exit 1; }

          # Login muss ein Token liefern
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-test-passwort"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          [ -n "$TOKEN" ] || { echo "::error::Login lieferte kein Token"; exit 1; }

          # Mit Token muss /api/scans 200 liefern (und das Frontend ausgeliefert werden)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/scans > /dev/null
          curl -sf http://localhost:8080/ | grep -qi '<div id="root">' \
            || { echo "::error::Frontend index.html wird nicht ausgeliefert"; exit 1; }
          echo "Smoke-Test bestanden"

      - name: Container-Logs (bei Fehler)
        if: failure()
        run: docker logs ssa-ci || true

      - name: Aufraeumen
        if: always()
        run: |
          docker rm -f ssa-ci || true
          docker volume rm ssa-ci-data || true
